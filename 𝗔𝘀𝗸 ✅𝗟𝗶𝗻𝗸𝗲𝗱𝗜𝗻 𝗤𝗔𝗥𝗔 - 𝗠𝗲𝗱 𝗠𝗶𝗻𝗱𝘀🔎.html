<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝗔𝘀𝗸 ✅𝗟𝗶𝗻𝗸𝗲𝗱𝗜𝗻 𝗤𝗔𝗥𝗔 - 𝗠𝗲𝗱 𝗠𝗶𝗻𝗱𝘀🔎</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
        }
        header, .content {
            width: 80%;
            margin: auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        img {
            max-width: 100%;
            height: auto;
        }
        #question {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            resize: none; /* Disables resizing the textarea */
            height: 75px; /* Adjust based on preference */
            box-sizing: border-box; /* Ensures padding does not affect width */
        }
        .select-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        select {
            width: 49%; /* Allows for two dropdowns in the same row */
            padding: 10px;
            font-size: 16px;
        }
        .button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #0073b1;
            color: white;
            border: none;
            border-radius: 5px;
            margin-right: 10px;
        }
        .button:last-child {
            margin-right: 0;
        }
        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "pk448j55g8");
</script>
<body>
    <header>
        <img src="https://content.linkedin.com/content/dam/me/business/en-us/amp/brand-site/v2/bg/LI-Logo.svg.original.svg" alt="LinkedIn Logo">
        <img src="https://media.licdn.com/dms/image/v2/D4E07AQFTIdPpIdlhCQ/group-logo_image-shrink_92x92/group-logo_image-shrink_92x92/0/1670075584338?e=1725800400&v=beta&t=ZstpBUm8WSrizsHa4bSMUJxkXeHia3adYi3uGLGUwuY" alt="QARA Logo">     
        <h1>Quality Assurance & Regulatory Affairs</h1>
        <h2>Ask ✅LinkedIn QARA - Med Minds🔎</h2>
        <textarea id="question" placeholder="Enter your question here"></textarea>
        <div class="select-group">
            <select id="deviceType">
                <option value="">Select Medical Field</option>
                <option value="Medical Device">Medical Device</option>
                <option value="In Vitro Diagnostics">In Vitro Diagnostics</option>
                <option value="Pharmaceuticals">Pharmaceuticals</option>
            </select>
            <select id="region">
                <option value="">Select Target Region</option>
                <option value="Europe">Europe</option>
                <option value="USA">USA</option>
                <option value="LATAM">LATAM</option>
                <option value="MENA">MENA</option>
                <option value="ASEAN">ASEAN</option>
            </select>
        </div>
        <div class="button-container">
            <button onclick="copyText()" class="button">Copy for AI</button>
            <button onclick="performSearch('google')" class="button">Google Search🔎</button>   
            <button onclick="performSearch('bing')" class="button">Bing Search🔎</button>
            <button onclick="performSearch('chatgpt')" class="button">Ask ChatGPT</button>
            <button onclick="performSearch('gemini')" class="button">Ask Gemini</button>
            <button onclick="performSearch('copilot')" class="button">Ask CoPilot</button>
        </div>
    </header>
    <script>
        function performSearch(engine) {
            var question = document.getElementById("question").value;
            var deviceType = document.getElementById("deviceType").value;
            var region = document.getElementById("region").value;
            var fullQuery = question + (deviceType ? ' - ' + deviceType : '') + (region ? ' in ' + region : '');
            var encodedQuery = encodeURIComponent(fullQuery);
            var url = '';
            switch(engine) {
                case 'google':
                    url = `https://www.google.com/search?q=${encodedQuery}`;
                    break;
                case 'bing':
                    url = `https://www.bing.com/search?q=${encodedQuery}`;
                    break;
                case 'chatgpt':
                    url = `https://chat.openai.com/chat`;
                    break;
                case 'gemini':
                    url = `https://gemini.google.com/app`;
                    break;
                case 'copilot':
                    url = `https://copilot.microsoft.com/search?q=${encodedQuery}`;
                    break;
            }

            if (url) {
                window.open(url, '_blank');
            }
        }

        function copyText() {
            var question = document.getElementById("question").value;
            var deviceType = document.getElementById("deviceType").value;
            var region = document.getElementById("region").value;
            var fullText = question + (deviceType ? ' - ' + deviceType : '') + (region ? ' in ' + region : '');
            var textArea = document.createElement("textarea");
            textArea.value = fullText;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            alert("Copied the text: " + fullText);
        }
    </script>
</body>
</html>
